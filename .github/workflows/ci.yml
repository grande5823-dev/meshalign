name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,webapp]" httpx
      - name: Core tests
        env:
          OMP_NUM_THREADS: "1"
        # no pipe: a failing pytest must fail the job
        run: pytest tests/ -v --tb=short
      - name: Webapp API tests
        env:
          OMP_NUM_THREADS: "1"
        working-directory: webapp
        run: pytest tests/test_api.py -v --tb=short
